name: Core Central publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag，例如 5.0.0-beta1 或 v5.0.0-beta1'
        required: true
        type: string
      confirm:
        description: '发布确认短语：PUBLISH <tag>'
        required: true
        type: string
      deploymentId:
        description: '仅公开已 VALIDATED 的本版部署时填写 ID；留空仍只构建并上传'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: central-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.deploymentId == ''
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 tag、确认短语与版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "tag 格式无效：$TAG" >&2; exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "PUBLISH $TAG" ]]; then
            echo "确认短语不匹配：需要 PUBLISH $TAG" >&2; exit 1
          fi
          test -f ".changelogs/$TAG.md" || { echo "缺少静态发布说明" >&2; exit 1; }
          VERSION="${TAG#v}"
          DECLARED="$(sed -n 's/^uilibVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$DECLARED" != "$VERSION" ]]; then
            echo "gradle.properties 版本 $DECLARED 与 tag $TAG 不一致" >&2; exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "tag $TAG 未指向本次检出的提交" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 无凭据完整构建
        shell: bash
        run: ./gradlew build "-PuilibVersion=${{ steps.version.outputs.version }}" --no-daemon --console=plain
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-central-build-reports
          path: build/reports
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 签名并上传 Central Portal
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew build publishToMavenCentral "-PuilibVersion=$VERSION" --no-daemon --console=plain
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-central-publish-reports
          path: build/reports
          retention-days: 7
          if-no-files-found: ignore
  release:
    if: inputs.deploymentId != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 公开已验证的指定部署
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          DEPLOYMENT_ID: ${{ inputs.deploymentId }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          const { INPUT_TAG: tag, INPUT_CONFIRM: confirm, DEPLOYMENT_ID: id, CENTRAL_USERNAME: username, CENTRAL_PASSWORD: password } = process.env;
          if (!/^v?5\.\d+\.\d+(?:[.-](?:alpha|beta|rc)[.-]?\d+)?$/.test(tag) || confirm !== 'PUBLISH ' + tag) throw new Error('tag 或发布确认不匹配');
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) throw new Error('deploymentId 格式无效');
          if (!username || !password) throw new Error('Central 发布凭据未配置');
          const version = tag.replace(/^v/, '');
          const expected = ["core"].map(name => 'pkg:maven/asia.quanhuzeyu.uilib/' + name + '@' + version);
          const headers = { Authorization: 'Bearer ' + Buffer.from(username + ':' + password).toString('base64') };
          const api = 'https://central.sonatype.com/api/v1/publisher/';
          async function status() {
            const response = await fetch(api + 'status?id=' + encodeURIComponent(id), { method: 'POST', headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error('读取部署状态失败 HTTP ' + response.status);
            return await response.json();
          }
          const deployment = await status();
          const purls = [...new Set(deployment.purls ?? [])];
          if (deployment.deploymentId !== id) throw new Error('响应中的部署 ID 不匹配');
          // Central 受理公开后不再返回 purls；坐标必须在 VALIDATED 的写入边界核对，后续只查询同一 ID。
          if (deployment.deploymentState === 'VALIDATED') {
            if (purls.length !== expected.length || expected.some(purl => !purls.includes(purl))) throw new Error('部署内容与本仓本版 Maven 坐标不匹配：' + JSON.stringify({ deploymentId: id, state: deployment.deploymentState, purls }));
            const response = await fetch(api + 'deployment/' + encodeURIComponent(id), { method: 'POST', headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error('公开部署失败 HTTP ' + response.status);
          } else if (!['PUBLISHING', 'PUBLISHED'].includes(deployment.deploymentState)) {
            throw new Error('部署尚未处于 VALIDATED：' + deployment.deploymentState);
          }
          // 重试已受理的部署只读取状态；成功必须对应最终 PUBLISHED。
          const deadline = Date.now() + 30 * 60 * 1000;
          let result = await status();
          while (result.deploymentState === 'PUBLISHING' && Date.now() < deadline) {
            await new Promise(resolve => setTimeout(resolve, 30000));
            result = await status();
          }
          console.log(JSON.stringify({ deploymentId: id, version, state: result.deploymentState, purls }));
          if (result.deploymentState !== 'PUBLISHED') throw new Error('部署未完成公开：' + result.deploymentState);
          JS
