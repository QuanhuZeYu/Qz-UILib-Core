name: Core release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag，例如 5.0.0-beta1 或 v5.0.0-beta1'
        required: true
        type: string
      confirm:
        description: '发布确认短语：PUBLISH <tag>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 tag、确认短语与版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "tag 格式无效：$TAG" >&2; exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "PUBLISH $TAG" ]]; then
            echo "确认短语不匹配：需要 PUBLISH $TAG" >&2; exit 1
          fi
          test -f ".changelogs/$TAG.md" || { echo "缺少静态发布说明" >&2; exit 1; }
          VERSION="${TAG#v}"
          DECLARED="$(sed -n 's/^uilibVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$DECLARED" != "$VERSION" ]]; then
            echo "gradle.properties 版本 $DECLARED 与 tag $TAG 不一致" >&2; exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "tag $TAG 未指向本次检出的提交" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 从 tag 完整构建
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew build releaseAssets --no-daemon --console=plain
          cp "build/libs/qz_uilib-$VERSION-core.jar" "build/release/qz-uilib-core-$VERSION.jar"
          cp "build/libs/qz_uilib-$VERSION-core-java8.jar" "build/release/qz-uilib-core-$VERSION-java8.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: core-release
          compression-level: 0
          path: |
            build/release/qz-uilib-core-*-maven.zip
            build/release/qz-uilib-core-*.jar
          if-no-files-found: error
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-release-reports
          path: build/reports
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: core-release
          path: release-assets
      # 生产资产固定到 tag；发布工具和同版本静态文案使用本次工作流提交。
      - name: 检出本次工作流的发布工具
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            tools/release.mjs
            .changelogs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 创建或更新同一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          node .release-tools/tools/release.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --title "Qz-UILib Core $VERSION" \
            --asset "release-assets/qz-uilib-core-$VERSION-maven.zip" \
            --asset "release-assets/qz-uilib-core-$VERSION.jar" \
            --asset "release-assets/qz-uilib-core-$VERSION-java8.jar" \
            --changelog ".release-tools/.changelogs/$TAG.md"
