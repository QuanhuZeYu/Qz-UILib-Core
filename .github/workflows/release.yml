name: Core release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag，例如 5.0.0-beta1 或 v5.0.0-beta1'
        required: true
        type: string
      confirm:
        description: '发布确认短语：PUBLISH <tag>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 tag、确认短语与版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "tag 格式无效：$TAG" >&2; exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "PUBLISH $TAG" ]]; then
            echo "确认短语不匹配：需要 PUBLISH $TAG" >&2; exit 1
          fi
          VERSION="${TAG#v}"
          DECLARED="$(sed -n 's/^uilibVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$DECLARED" != "$VERSION" ]]; then
            echo "gradle.properties 版本 $DECLARED 与 tag $TAG 不一致" >&2; exit 1
          fi
          git fetch --force --tags origin
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "tag $TAG 未指向本次检出的提交" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 从 tag 完整构建
        shell: bash
        run: ./gradlew build releaseAssets --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: core-release
          path: build/release/qz-uilib-core-*-maven.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: core-release
          path: release-assets
      - name: 创建或更新同一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node tools/release.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --title "Qz-UILib Core $VERSION" \
            --asset "release-assets/qz-uilib-core-$VERSION-maven.zip" \
            --changelog ".changelogs/$TAG.md" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL" \
            --scope "Core 完整 build：Java21 与 Java8 正式 Jar、开发与源码产物、gallery 与 core-verification 测试消费者；Maven ZIP 根目录为 asia/quanhuzeyu/uilib。"