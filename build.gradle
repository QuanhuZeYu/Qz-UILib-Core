import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

buildscript {
    repositories { mavenCentral(); gradlePluginPortal() }
    dependencies { classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.2.2' }
}
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish.base' version '0.37.0'
}
apply plugin: 'com.gradleup.shadow'
apply plugin: 'signing'

// 项目属性同时接收原 -P、工程声明和工作站按提交记录的本地开发组合。
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
// 旧版调用仍使用历史坐标；新系列默认使用已验证的 Central namespace。
group = findProperty('uilibGroup') ?: (version.toString().tokenize('.')[0].toInteger() >= 5 ? 'asia.quanhuzeyu.uilib' : 'club.heiqi.uilib')
// 原RFG从此公共镜像取得ICU；保留相同坐标和缓存来源，仓库本身不引入MC依赖。
repositories {
    maven { url = uri('https://libraries.minecraft.net'); content { includeModule('com.ibm.icu', 'icu4j') } }
    mavenCentral()
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }

// 开发编译使用原始内容包；正式成品统一私有重定位，并保留全部动态资源。
configurations { coreContent }
dependencies {
    coreContent 'com.ibm.icu:icu4j:76.1'
    coreContent 'org.yaml:snakeyaml:2.4'
    coreContent 'org.commonmark:commonmark:0.21.0'
    coreContent 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    coreContent 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    coreContent 'org.jsoup:jsoup:1.19.1'
    coreContent 'org.nibor.autolink:autolink:0.10.0'
}
sourceSets {
    main {
        java.srcDirs = ['src/core/java']; resources.srcDirs = ['src/core/resources']
        compileClasspath = configurations.coreContent
        runtimeClasspath = output + compileClasspath
    }
    legacy {
        java.srcDirs = ['src/core/java']; resources.srcDirs = ['src/core/resources']
        compileClasspath = configurations.coreContent
        runtimeClasspath = output + compileClasspath
    }
    gallery {
        java.srcDirs = ['src/gallery/java']; resources.srcDirs = ['src/gallery/resources', 'src/mediaTest/resources']
        compileClasspath = sourceSets.legacy.output
        runtimeClasspath = output + compileClasspath
    }
    testSupport {
        java.srcDirs = ['src/testSupport/java']
        compileClasspath = files(); runtimeClasspath = output
    }
    testHost {
        java.srcDirs = ['src/testHost/java']
        compileClasspath = sourceSets.legacy.output; runtimeClasspath = output + compileClasspath
    }
    galleryVerification {
        java.srcDirs = ['src/galleryVerification/java']; resources.srcDirs = ['src/galleryVerification/resources']
        compileClasspath = sourceSets.legacy.output + sourceSets.testSupport.output + sourceSets.gallery.output + configurations.coreContent
        runtimeClasspath = output + compileClasspath
    }
    test { java.setSrcDirs([]); resources.setSrcDirs([]) }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none']
    options.release = name == 'compileJava' ? 21 : 8
}
tasks.named('jar', Jar) {
    archiveClassifier = 'development'
    from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
tasks.named('shadowJar') { enabled = false }
def contentPackages = ['com.ibm.icu', 'org.yaml.snakeyaml', 'org.commonmark', 'org.jsoup', 'org.nibor.autolink']
def coreArtifact = { String taskName, String classifier, String sourceName ->
    tasks.register(taskName, ShadowJar) {
        group = 'build'; archiveBaseName = 'qz_uilib'; archiveClassifier = classifier
        from sourceSets[sourceName].output
        from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
        configurations = [project.configurations.coreContent]
        enableAutoRelocation = false
        contentPackages.each { relocate it, 'club.heiqi.uilib.shadow.' + it }
        exclude 'META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}
def coreJar = coreArtifact('coreJar', 'core', 'main')
def coreLegacyJar = coreArtifact('coreLegacyJar', 'core-java8', 'legacy')
def legacyDevelopmentJar = tasks.register('legacyDevelopmentJar', Jar) {
    archiveClassifier = 'development-java8'; from sourceSets.legacy.output
    from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
def galleryJar = tasks.register('galleryJar', Jar) {
    group = 'verification'; archiveClassifier = 'gallery'; from sourceSets.gallery.output
    from('LICENSE')
}
// 验证附件可被独立取用；许可复用生产资源原文，不依赖 Core Jar 恰好同时交付。
def verificationNotices = copySpec {
    from('src/core/resources') {
        include 'assets/qz_uilib/unicode/emoji17/LICENSE.txt', 'assets/qz_uilib/math/catalog/LICENSE-KaTeX.txt'
    }
    from('src/galleryVerification/THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
// 其他仓只消费测试消费者，不能把它加入正式运行时或正式发行。
def verificationJar = tasks.register('verificationJar', Jar) {
    group = 'verification'; archiveClassifier = 'verification'
    from sourceSets.testSupport.output, sourceSets.testHost.output, sourceSets.galleryVerification.output
    from('LICENSE'); with verificationNotices
}
tasks.named('assemble') { dependsOn coreJar, coreLegacyJar, legacyDevelopmentJar }
tasks.named('sourcesJar') { from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' } }
def gallerySourcesJar = tasks.register('gallerySourcesJar', Jar) {
    archiveBaseName = 'gallery'; archiveClassifier = 'sources'; from sourceSets.gallery.allSource
    from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
def verificationSourcesJar = tasks.register('verificationSourcesJar', Jar) {
    archiveBaseName = 'core-verification'; archiveClassifier = 'sources'
    from sourceSets.testSupport.allSource, sourceSets.testHost.allSource, sourceSets.galleryVerification.allSource
    from('LICENSE'); with verificationNotices
}
def coreJavadoc = tasks.register('coreJavadoc', Javadoc) {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/javadoc/' + name).get().asFile
    options.encoding = 'UTF-8'; options.addStringOption('Xdoclint:none', '-quiet')
}
def galleryJavadoc = tasks.register('galleryJavadoc', Javadoc) {
    source = sourceSets.gallery.allJava
    classpath = sourceSets.gallery.compileClasspath
    dependsOn sourceSets.gallery.classesTaskName
    destinationDir = layout.buildDirectory.dir('docs/javadoc/' + name).get().asFile
    options.encoding = 'UTF-8'; options.addStringOption('Xdoclint:none', '-quiet')
}
def verificationJavadoc = tasks.register('verificationJavadoc', Javadoc) {
    source sourceSets.testSupport.allJava, sourceSets.testHost.allJava, sourceSets.galleryVerification.allJava
    classpath = sourceSets.testSupport.compileClasspath + sourceSets.testHost.compileClasspath + sourceSets.galleryVerification.compileClasspath
    dependsOn sourceSets.testSupport.classesTaskName, sourceSets.testHost.classesTaskName, sourceSets.galleryVerification.classesTaskName
    destinationDir = layout.buildDirectory.dir('docs/javadoc/' + name).get().asFile
    options.encoding = 'UTF-8'; options.addStringOption('Xdoclint:none', '-quiet')
}
def javadocJar = { String taskName, String baseName, javadocTask ->
    tasks.register(taskName, Jar) {
        archiveBaseName = baseName; archiveClassifier = 'javadoc'; from javadocTask
        from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
    }
}
def coreJavadocJar = javadocJar('coreJavadocJar', 'Qz-UILib-Core', coreJavadoc)
def galleryJavadocJar = javadocJar('galleryJavadocJar', 'gallery', galleryJavadoc)
def verificationJavadocJar = javadocJar('verificationJavadocJar', 'core-verification', verificationJavadoc)
// 核心断言归广场应用；Gradle 的空 JUnit 入口不参与 check。
tasks.named('test', Test) { enabled = false; group = null }

// Windows Java8 launcher不能可靠接收含中文的绝对-cp；相对路径仍消费原编译输出。
tasks.withType(JavaExec).configureEach {
    doFirst {
        def base = workingDir.toPath()
        def entries = classpath.files.collect {
            def entry = it.toPath()
            entry.root == base.root ? base.relativize(entry).toString() : entry.toString()
        }
        classpath = files()
        jvmArgs '-cp', entries.join(File.pathSeparator)
    }
}

// 同一检查目录只启动一个应用；Java21 另从正式 core Jar 运行，验证目标和产物隔离。
def galleryChecks = [8, 21].collect { target ->
    def artifact = target == 8 ? coreLegacyJar : coreJar
    tasks.register(target == 8 ? 'galleryVerify' : 'galleryVerifyJava21', JavaExec) {
        group = 'verification'; description = '运行广场核心检查并保存具名结果（Java' + target + '）'
        mainClass = 'club.heiqi.uilib.testing.gallery.verification.CoreGalleryVerification'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target) }
        dependsOn verificationJar, galleryJar, artifact
        classpath = target == 8 ? sourceSets.galleryVerification.runtimeClasspath
                : sourceSets.galleryVerification.output + sourceSets.testSupport.output + sourceSets.gallery.output + files(artifact)
        jvmArgs '-Dfile.encoding=UTF-8'; maxHeapSize = '1g'
        systemProperty 'java.awt.headless', 'true'
        doFirst {
            def reportDirectory = layout.buildDirectory.dir('reports/gallery-java' + target).get().asFile
            // Windows Java8 的 -D 参数同样会误解中文绝对路径，报告相对任务工作目录传入。
            systemProperty 'uilib.verification.report', target == 8
                    ? workingDir.toPath().relativize(reportDirectory.toPath()).toString() : reportDirectory.absolutePath
            systemProperty 'uilib.verification.core', project.relativePath(artifact.get().archiveFile.get().asFile)
            if (providers.gradleProperty('galleryChecks').isPresent()) args providers.gradleProperty('galleryChecks').get().split(',') as List
        }
    }
}
tasks.named('check') { setDependsOn(galleryChecks) }

// Central 与 Release Maven ZIP 复用 POM 元数据；测试消费者只随 ZIP 分发。
def pomMetadata = { pom, String artifactName, String description ->
    pom.name.set('Qz-UILib ' + artifactName)
    pom.description.set(description)
    pom.url.set('https://github.com/QuanhuZeYu/Qz-UILib-Core')
    pom.licenses {
        license {
            delegate.name.set('MIT License')
            url.set('https://opensource.org/licenses/MIT')
            distribution.set('repo')
        }
    }
    pom.developers {
        developer {
            delegate.id.set('QuanhuZeYu')
            delegate.name.set('QuanhuZeYu')
        }
    }
    pom.scm {
        connection.set('scm:git:https://github.com/QuanhuZeYu/Qz-UILib-Core.git')
        developerConnection.set('scm:git:ssh://git@github.com/QuanhuZeYu/Qz-UILib-Core.git')
        url.set('https://github.com/QuanhuZeYu/Qz-UILib-Core')
    }
}
def releaseStage = layout.buildDirectory.dir('release/maven')
publishing {
    publications {
        core(MavenPublication) {
            artifactId = 'core'; artifact(coreJar) { classifier = null }
            artifact(coreLegacyJar) { classifier = 'java8' }
            artifact(tasks.named('jar')) { classifier = 'development' }
            artifact(legacyDevelopmentJar) { classifier = 'development-java8' }
            artifact(tasks.named('sourcesJar')) { classifier = 'sources' }
            artifact(coreJavadocJar) { classifier = 'javadoc' }
            pom { pomMetadata(delegate, 'core', '无 Minecraft 前提的 UILib 核心；Java21 与 Java8 正式产物、开发与源码。') }
        }
        gallery(MavenPublication) {
            artifactId = 'gallery'; artifact(galleryJar) { classifier = null }
            artifact(gallerySourcesJar) { classifier = 'sources' }
            artifact(galleryJavadocJar) { classifier = 'javadoc' }
            pom { pomMetadata(delegate, 'gallery', 'UILib 共享广场测试消费者，不进入正式发行；仅随 Release Maven ZIP 供 CI 消费。') }
        }
        verification(MavenPublication) {
            artifactId = 'core-verification'; artifact(verificationJar) { classifier = null }
            artifact(verificationSourcesJar) { classifier = 'sources' }
            artifact(verificationJavadocJar) { classifier = 'javadoc' }
            pom { pomMetadata(delegate, 'core-verification', 'UILib 核心验证测试消费者，不进入正式发行；仅随 Release Maven ZIP 供 CI 消费。') }
        }
    }
    repositories {
        maven {
            name = 'Workspace'
            url = uri(findProperty('uilibRepository') ?: layout.buildDirectory.dir('repository').get().asFile)
            if (url.scheme != 'file') throw new GradleException('Workspace仅写入本地Maven目录')
        }
        maven {
            name = 'ReleaseStage'
            url = uri(releaseStage.get().asFile)
        }
    }
}
// Central 与本地 ZIP 共用这一套签名入口；没有密钥时本地 build/releaseAssets 保持可用。
def signingInMemoryKey = findProperty('signingInMemoryKey') ?: findProperty('signingKey') ?: System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKey') ?: System.getenv('SIGNING_KEY')
def signingInMemoryKeyId = findProperty('signingInMemoryKeyId') ?: System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKeyId')
def signingInMemoryKeyPassword = findProperty('signingInMemoryKeyPassword') ?: findProperty('signingPassword') ?: System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKeyPassword') ?: System.getenv('SIGNING_PASSWORD') ?: ''
if (signingInMemoryKey) {
    signing {
        useInMemoryPgpKeys(signingInMemoryKeyId as String, signingInMemoryKey as String, signingInMemoryKeyPassword as String)
        sign publishing.publications
    }
}
mavenPublishing { publishToMavenCentral(false) }
tasks.withType(PublishToMavenRepository).matching { it.repository?.name == 'mavenCentral' }.configureEach {
    // 只约束 Central，Workspace 与 ReleaseStage 仍保留完整测试消费者。
    onlyIf('Central 只发布生产 publication') { publication.name in ['core'] }
    doFirst { if (!signingInMemoryKey) throw new GradleException('Maven Central 发布缺少 signingInMemoryKey（或 SIGNING_KEY）') }
}
tasks.register('publishWorkspace') {
    group = 'publishing'; description = '把明确版本的核心、开发与测试消费者写入本地Maven仓'
    dependsOn tasks.withType(PublishToMavenRepository).matching { it.repository?.name == 'Workspace' }
}
// 发布资产只取本次发布阶段目录，避免 build/libs 的旧版本残留混入。
def prepareReleaseStage = tasks.register('prepareReleaseStage', Delete) {
    delete releaseStage
}
tasks.withType(PublishToMavenRepository).matching { it.repository?.name == 'ReleaseStage' }.configureEach {
    dependsOn prepareReleaseStage
}
tasks.register('releaseAssets', Zip) {
    group = 'publishing'; description = '把本次版本的 Maven 布局写成固定名发布 ZIP'
    dependsOn tasks.withType(PublishToMavenRepository).matching { it.repository?.name == 'ReleaseStage' }
    archiveFileName = "qz-uilib-core-${version}-maven.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
    from releaseStage
    if (signingInMemoryKey) dependsOn tasks.withType(org.gradle.plugins.signing.Sign)
}